name: Code Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Project
        uses: ./.gitea/actions/setup

      - name: Run lint and format check
        run: yarn run lint

      - name: Run type check
        run: yarn run check
