name: Update Open Source Licenses

on:
  workflow_dispatch:

jobs:
  generate-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore FOSSA CLI cache
        id: cache-fossa
        uses: actions/cache@v4
        with:
          path: .fossa-bin/
          key: fossa-cli-${{ runner.os }}

      - name: Install FOSSA CLI
        if: steps.cache-fossa.outputs.cache-hit != 'true'
        run: |
          mkdir -p .fossa-bin
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b .fossa-bin

      - name: Add FOSSA to PATH
        run: echo "$PWD/.fossa-bin" >> $GITHUB_PATH

      - name: Generate FOSSA Attribution Report
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          fossa analyze || echo "Fossa analyze skipped or failed, attempting report generation..."

          echo "Waiting for Fossa analysis to complete..."
          fossa test

          fossa report attribution --format markdown > LICENSES.md
          fossa report attribution --format html > public/licenses.html

          ./.gitea/scripts/inject_declared_license

      - name: Setup Project
        if: success()
        uses: ./.gitea/actions/setup

      - name: Format Licenses
        if: success()
        run: yarn run format

      - name: Check changes
        if: success()
        id: check-changes
        run: |
          if [ -z "$(git diff --unified=0 LICENSES.md | grep -Ev '^(diff|index|\+{3}|\-{3}|@@|[+-][0-9]{2}/[0-9]{2}/[0-9]{2} \| [0-9a-f]{40})')" ]; then
            echo "No license changes detected. Skipping PR creation."
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request via Git & Gitea API
        if: success() && steps.check-changes.outputs.changes_detected == 'true'
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Gitea Actions Bot"
          git config --global user.email "GiteaAction@gitea.internal"

          BRANCH_NAME="chore/update-licenses-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"

          git add LICENSES.md public/licenses.html

          git commit -m "docs: update third-party license reports [skip ci]"
          git push origin "$BRANCH_NAME"

          curl -X POST \
            -H "Authorization: token $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"head\":\"$BRANCH_NAME\",\"base\":\"main\",\"title\":\"Update Third-Party License Notices\",\"body\":\"Automated update triggered via workflow_dispatch.\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls"
