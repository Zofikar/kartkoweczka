name: Setup Kartkoweczka Toolchain
description: Sets up Node, yarn and dependencies

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
