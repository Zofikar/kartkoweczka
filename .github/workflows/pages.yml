name: Publish PWA to GitHub Pages

on:
  workflow_run:
    workflows: ['Native release']
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit (blank uses the selected workflow branch)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve deployment ref
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          ref="$REQUESTED_REF"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            ref="${ref:-$WORKFLOW_REF}"
          else
            ref=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build browser PWA
        env:
          DATABASE_BACKEND: browser
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ORIGIN: ${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
          VITE_SCHEMA: https
        run: |
          node scripts/generate-sitemap.mjs
          yarn build
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
