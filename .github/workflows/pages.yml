name: Publish PWA to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit (blank uses the selected workflow branch)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve deployment ref
        id: release
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          ref="${REQUESTED_REF:-$WORKFLOW_REF}"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Snapshot build version
        env:
          DEPLOY_REF: ${{ steps.release.outputs.ref }}
        run: |
          if [[ "$DEPLOY_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            export RELEASE_TAG="$DEPLOY_REF"
          fi
          node scripts/version.mjs --github-env
      - run: yarn install --immutable
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build browser PWA
        env:
          DATABASE_BACKEND: browser
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ORIGIN: ${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
          VITE_SCHEMA: https
        run: yarn build
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
