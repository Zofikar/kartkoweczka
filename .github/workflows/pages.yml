name: Publish PWA to GitHub Pages

on:
  workflow_run:
    workflows: ['Native release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build browser PWA
        env:
          DATABASE_BACKEND: browser
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ORIGIN: ${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
          VITE_SCHEMA: https
        run: |
          node scripts/generate-sitemap.mjs
          yarn build
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
