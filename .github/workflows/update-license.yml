name: Update Open Source Licenses

on:
  workflow_dispatch:

jobs:
  generate-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Project
        uses: ./.github/actions/setup

      - name: Install FOSSA CLI
        run: |
          mkdir -p .fossa-bin
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash -s -- -b .fossa-bin

      - name: Add FOSSA to PATH
        run: echo "$PWD/.fossa-bin" >> $GITHUB_PATH

      - name: Generate FOSSA Attribution Report
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          if [ -z "$FOSSA_API_KEY" ]; then
            echo "::error::Configure the FOSSA_API_KEY repository secret before generating reports."
            exit 1
          fi
          fossa analyze
          # Report generation waits for analysis without enforcing policy checks.
          fossa report attribution --format markdown > LICENSES.md
          fossa report attribution --format html > public/licenses.html

      - name: Inject declared project license
        run: python3 .github/scripts/inject_declared_license

      - name: Format Licenses
        if: success()
        run: yarn exec prettier --write LICENSES.md public/licenses.html

      - name: Check changes
        if: success()
        id: check-changes
        run: |
          if git diff --quiet -- LICENSES.md public/licenses.html; then
            echo "No license changes detected. Skipping PR creation."
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request via Git & Github API
        if: success() && steps.check-changes.outputs.changes_detected == 'true'
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "GithubAction@github.com"

          BRANCH_NAME="chore/update-licenses-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"

          git add LICENSES.md public/licenses.html

          git commit -m "docs: update third-party license reports [skip ci]"
          git push origin "$BRANCH_NAME"

          curl --fail-with-body -X POST \
            -H "Authorization: token $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"head\":\"$BRANCH_NAME\",\"base\":\"main\",\"title\":\"Update Third-Party License Notices\",\"body\":\"Automated update triggered via workflow_dispatch.\"}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pulls"
